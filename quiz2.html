<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Quiz2：True／False 医師×マッチングアプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #1a4d7a;
      font-size: 2.2em;
      text-align: center;
      margin-bottom: 1em;
    }
    .quiz-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .progress {
      text-align: right;
      font-size: 0.9em;
      color: #777;
      margin-bottom: 20px;
    }
    .question-box {
      margin-bottom: 20px;
    }
    .choice-button {
      display: inline-block;
      width: 45%;
      margin: 8px 2.5%;
      padding: 14px 20px;
      background-color: #2c3e50;
      color: #fff;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      text-align: center;
    }
    .choice-button:hover {
      background-color: #163f66;
    }
    .result {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      color: #1a4d7a;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
    .back-link a {
      color: #1a4d7a;
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 20px 15px;
      }
      h1 {
        font-size: 1.8em;
      }
      .choice-button {
        width: 100%;
        margin: 8px 0;
        font-size: 0.95em;
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <h1>Quiz2：True／False 医師×マッチングアプリ</h1>
  <div class="quiz-container">
    <div class="progress">1／1問目</div>
    <div class="question-box">
      <p><strong>Q1．</strong> 街中で出会った生産年齢人口（15〜64歳）の人が医師である確率は、約0.05％である。True or False？</p>
      <button class="choice-button" onclick="checkAnswer('True')">True</button>
      <button class="choice-button" onclick="checkAnswer('False')">False</button>
    </div>
    <div id="result" class="result"></div>
    <div class="back-link">
      <a href="index.html">&larr; メニューに戻る</a>
    </div>
  </div>

  <script>
    function checkAnswer(choice) {
      let resultText = '';
      if (choice === 'False') {
        resultText = '✅ 正解！約0.05％ではなく、約0.47％が実際の確率です。';
      } else {
        resultText = '❌ 残念！正解は False です。約0.47％が実際の確率です。';
      }
      document.getElementById('result').innerText = resultText;
    }
  </script>
</body>
</html>
