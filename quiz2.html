<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Quiz2：True／False 医師×マッチングアプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #1a4d7a;
      font-size: 2.2em;
      text-align: center;
      margin-bottom: 1em;
    }
    .quiz-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .progress {
      text-align: right;
      font-size: 0.9em;
      color: #777;
      margin-bottom: 20px;
    }
    .question-box {
      margin-bottom: 20px;
    }
    .choice-button {
      display: inline-block;
      width: 45%;
      margin: 8px 2.5%;
      padding: 14px 20px;
      background-color: #2c3e50;
      color: #fff;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
      text-align: center;
    }
    .choice-button:hover {
      background-color: #163f66;
    }
    .result {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      color: #1a4d7a;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
    .back-link a {
      color: #1a4d7a;
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 20px 15px;
      }
      h1 {
        font-size: 1.8em;
      }
      .choice-button {
        width: 100%;
        margin: 8px 0;
        font-size: 0.95em;
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <h1>Quiz2：True／False 医師×マッチングアプリ</h1>
  <div class="quiz-container">
    <div class="progress" id="progress">1／3問目</div>
    <div class="question-box" id="questionBox">
      <!-- 質問内容は JS で切り替え -->
    </div>
    <div id="result" class="result"></div>
    <div class="back-link">
      <a href="index.html">&larr; メニューに戻る</a>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: '街中で出会った生産年齢人口（15〜64歳）の人が医師である確率は、約0.05％である。True or False？',
        answer: 'False'
      },
      {
        text: 'マッチングアプリ登録者内で医師であると仮定した確率は約0.47％である。True or False？',
        answer: 'False'
      },
      {
        text: '登録者数約2,200万人・医師数約10,000人と仮定した場合、医師割合は約0.045〜0.05％となる。True or False？',
        answer: 'True'
      }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      const q = questions[current];
      document.getElementById('progress').innerText = (current+1) + '／' + questions.length + '問目';
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p><strong>Q'+(current+1)+'．</strong> '+ q.text +'</p>' +
        '<button class="choice-button" onclick="selectAnswer(\'True\')">True</button>' +
        '<button class="choice-button" onclick="selectAnswer(\'False\')">False</button>';
      document.getElementById('result').innerText = '';
    }

    function selectAnswer(choice) {
      if (choice === questions[current].answer) {
        score++;
        document.getElementById('result').innerText = '✅ 正解！';
      } else {
        document.getElementById('result').innerText = '❌ 残念！正解は「'+ questions[current].answer +'」です。';
      }
      current++;
      setTimeout(function(){
        if (current < questions.length) {
          showQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p>あなたの正解数： '+ score +' ／ '+ questions.length +'</p>' +
                      '<p>正答率： '+ ((score/questions.length)*100).toFixed(1) +'％</p>' +
                      '<button class="choice-button" onclick="restartQuiz()">もう一回挑戦する</button>' +
                      '<button class="choice-button" onclick="location.href=\'index.html\'">他のクイズへ</button>';
      localStorage.setItem('quiz2Result', JSON.stringify({ date: new Date().toISOString(), score: score }));
    }

    function restartQuiz() {
      current = 0;
      score = 0;
      showQuestion();
    }

    // 初期表示
    showQuestion();
  </script>
</body>
</html>
