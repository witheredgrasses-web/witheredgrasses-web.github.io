<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Quiz3：計算＆穴埋め 医師割合を考える</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #1a4d7a;
      font-size: 2.2em;
      text-align: center;
      margin-bottom: 1em;
    }
    .quiz-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .progress {
      text-align: right;
      font-size: 0.9em;
      color: #777;
      margin-bottom: 20px;
    }
    .question-box {
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 8px;
      font-size: 1em;
      width: 80px;
      margin-left: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .submit-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin-top: 15px;
      background-color: #2c3e50;
      color: #fff;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }
    .submit-button:hover {
      background-color: #163f66;
    }
    .result {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      color: #1a4d7a;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
    .back-link a {
      color: #1a4d7a;
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 20px 15px;
      }
      h1 {
        font-size: 1.8em;
      }
      input[type="text"] {
        width: 60px;
      }
    }
  </style>
</head>
<body>
  <h1>Quiz3：計算＆穴埋め 医師割合を考える</h1>
  <div class="quiz-container">
    <div class="progress" id="progress">1／2問目</div>
    <div class="question-box" id="questionBox">
      <!-- 入力問題を JS で切り替え -->
    </div>
    <div id="result" class="result"></div>
    <div class="back-link">
      <a href="index.html">&larr; メニューに戻る</a>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: '日本の医師数：343,275人。生産年齢人口（15〜64歳）：73,522,000人。\n医師数 ÷ 生産年齢人口 ×100 = ',
        correct: (343275 / 73522000) * 100
      },
      {
        text: '登録者数約3,000万人（アプリ2件合算）、医師数約10,000人と仮定。\n医師数 ÷ 実質母数約22,000,000人 ×100 = ',
        correct: (10000 / 22000000) * 100
      }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      const q = questions[current];
      document.getElementById('progress').innerText = (current+1) + '／' + questions.length + '問目';
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p><strong>Q'+(current+1)+'．</strong> '+ q.text +
                      '<input type="text" id="inputAnswer" placeholder="％で入力">％</p>' +
                      '<button class="submit-button" onclick="submitAnswer()">答えを見る</button>';
      document.getElementById('result').innerText = '';
    }

    function submitAnswer() {
      const ans = parseFloat(document.getElementById('inputAnswer').value);
      const correctVal = questions[current].correct;
      if (!isNaN(ans) && Math.abs(ans - correctVal) < (correctVal * 0.2)) {  // 20%以内誤差OK
        score++;
        document.getElementById('result').innerText = '✅ 正解に近いです！約 '+ correctVal.toFixed(3) +'％です。';
      } else {
        document.getElementById('result').innerText = '❌ 残念！正解は約 '+ correctVal.toFixed(3) +'％です。';
      }
      document.getElementById('questionBox').innerHTML += '<button class="submit-button" onclick="nextQuestion()">次へ</button>';
    }

    function nextQuestion() {
      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p>あなたの正解数： '+ score +' ／ '+ questions.length +'</p>' +
                      '<p>正答率： '+ ((score/questions.length)*100).toFixed(1) +'％</p>' +
                      '<button class="submit-button" onclick="restartQuiz()">もう一回挑戦する</button>' +
                      '<button class="submit-button" onclick="location.href=\'index.html\'">他のクイズへ</button>';
      localStorage.setItem('quiz3Result', JSON.stringify({ date: new Date().toISOString(), score: score }));
    }

    function restartQuiz() {
      current = 0;
      score = 0;
      showQuestion();
    }

    showQuestion();
  </script>
</body>
</html>
