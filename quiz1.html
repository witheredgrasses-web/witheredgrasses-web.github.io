<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Quiz1：マルチチョイス形式 医師×マッチングアプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f9fc;
      color: #333;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #1a4d7a;
      font-size: 2.2em;
      text-align: center;
      margin-bottom: 1em;
    }
    .quiz-container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .progress {
      text-align: right;
      font-size: 0.9em;
      color: #777;
      margin-bottom: 20px;
    }
    .question-box {
      margin-bottom: 20px;
    }
    .choice-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      margin: 10px 0;
      background-color: #2c3e50;
      color: #fff;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }
    .choice-button:hover {
      background-color: #163f66;
    }
    .result {
      margin-top: 20px;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      color: #1a4d7a;
    }
    .back-link {
      text-align: center;
      margin-top: 30px;
    }
    .back-link a {
      color: #1a4d7a;
      text-decoration: none;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .quiz-container {
        padding: 20px 15px;
      }
      h1 {
        font-size: 1.8em;
      }
      .choice-button {
        font-size: 0.95em;
        padding: 12px 15px;
      }
    }
  </style>
</head>
<body>
  <h1>Quiz1：マルチチョイス形式 医師×マッチングアプリ</h1>
  <div class="quiz-container">
    <div class="progress">1／1問目</div>
    <div class="question-box">
      <p><strong>Q1．</strong> 次のうち、マッチングアプリ登録者内で医師であると仮定した確率に最も近いのはどれ？</p>
      <button class="choice-button" onclick="checkAnswer('A')">A) 0.01％</button>
      <button class="choice-button" onclick="checkAnswer('B')">B) 0.05％</button>
      <button class="choice-button" onclick="checkAnswer('C')">C) 0.47％</button>
    </div>
    <div id="result" class="result"></div>
    <div class="back-link">
      <a href="index.html">&larr; メニューに戻る</a>
    </div>
  </div>

  <script>
    function checkAnswer(choice) {
      let resultText = '';
      if (choice === 'B') {
        resultText = '✅ 正解！B) 0.05％が近い値です。';
      } else {
        resultText = '❌ 残念！正解は B) 0.05％ です。';
      }
      document.getElementById('result').innerText = resultText;
    }
  </script>
</body>
</html>
