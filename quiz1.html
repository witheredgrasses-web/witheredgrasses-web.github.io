<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Quiz1：マルチチョイス形式 医師×マッチングアプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* (前と同じスタイル省略) */
  </style>
</head>
<body>
  <h1>Quiz1：マルチチョイス形式 医師×マッチングアプリ</h1>
  <div class="quiz-container">
    <div class="progress" id="progress">1／3問目</div>

    <div class="question-box" id="questionBox">
      <!-- 質問内容は JS で切り替え -->
    </div>

    <div id="result" class="result"></div>

    <div class="back-link">
      <a href="index.html">&larr; メニューに戻る</a>
    </div>
  </div>

  <script>
    // 問題・選択肢・正解のデータ
    const questions = [
      {
        text: '次のうち、マッチングアプリ登録者内で医師であると仮定した確率に最も近いのはどれ？',
        choices: ['0.01％', '0.05％', '0.47％'],
        answerIndex: 1
      },
      {
        text: '街中で出会った生産年齢人口の人が医師である確率は、おおよそ何％でしょう？',
        choices: ['0.05％', '0.47％', '5％'],
        answerIndex: 1
      },
      {
        text: 'マッチングアプリ2件合算、重複を仮定し登録者数約2,200万人、医師数約10,000人とした場合、医師割合はおおよそ何％？',
        choices: ['0.045％', '0.45％', '4.5％'],
        answerIndex: 0
      }
    ];

    let current = 0;
    let score = 0;

    function showQuestion() {
      const q = questions[current];
      document.getElementById('progress').innerText = (current+1) + '／' + questions.length + '問目';
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p><strong>Q'+(current+1)+'．</strong> '+q.text+'</p>';
      q.choices.forEach((choice, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice-button';
        btn.innerText = (['A)','B)','C)'][idx] || '') + choice;
        btn.onclick = () => selectAnswer(idx);
        box.appendChild(btn);
      });
    }

    function selectAnswer(idx) {
      const q = questions[current];
      const resultDiv = document.getElementById('result');
      if (idx === q.answerIndex) {
        score++;
        resultDiv.innerText = '✅ 正解！';
      } else {
        resultDiv.innerText = '❌ 残念！正解は '+ q.choices[q.answerIndex] +' です。';
      }
      // 次の問題または結果へ
      setTimeout(() => {
        resultDiv.innerText = '';
        current++;
        if (current < questions.length) {
          showQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      const box = document.getElementById('questionBox');
      box.innerHTML = '<p>あなたの正解数： '+ score +' ／ '+ questions.length +'</p>'
                    + '<p>正答率： '+ ((score/questions.length)*100).toFixed(1) +'％</p>'
                    + '<button class="choice-button" onclick="restartQuiz()">もう一回挑戦する</button>'
                    + '<button class="choice-button" onclick="location.href=\'index.html\'">他のクイズへ</button>';
      // 結果を保存
      const results = JSON.parse(localStorage.getItem('quiz1Results') || '[]');
      results.push({ date: new Date().toISOString(), score: score });
      localStorage.setItem('quiz1Results', JSON.stringify(results));
    }

    function restartQuiz() {
      current = 0;
      score = 0;
      showQuestion();
    }

    // 初期表示
    showQuestion();
  </script>
</body>
</html>
